bind r source-file ~/.tmux.conf \; display "Reloaded!"

set -g mouse on
# numbering the windows and panes from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Binding to split horizontally and vertically
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key "\\" split-window -fh -c "#{pane_current_path}"

bind-key "-" split-window -v -c "#{pane_current_path}"
bind-key "_" split-window -fv -c "#{pane_current_path}"

set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'vndmp4/tmux-fzf-session-switch'

run '~/.tmux/plugins/tpm/tpm'
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux
run-shell ~/.tmux/plugins/tmux-fzf-session-switch/main.tmux
run '~/.tmux/plugins/dracula/dracula.tmux'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '30'
set -g status-right 'Continuum status: #{continuum_status}'
set-option -g @fzf-goto-session-only 'true'

set -g pane-border-format "#{pane_index} #[fg=green]#{pane_title}"
set-hook -g pane-focus-in 'run-shell "tmux select-pane -T \"#{pane_current_command}\""'

# ===========================================================================
# Beginner-friendly additions
# ===========================================================================

# Move between panes WITHOUT the prefix — just Alt + arrow keys
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Move between panes WITH prefix, vim-style h/j/k/l (left/down/up/right)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize the current pane:  prefix then H/J/K/L (hold to repeat)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Switch windows (tabs) WITHOUT the prefix — Shift + arrow
bind -n S-Left  previous-window
bind -n S-Right next-window

# Cheat sheet popup:  prefix ?   (press q to close it)
bind ? display-popup -w 82% -h 82% -E "less -R ~/Work/Fun/dotfiles/tmux/cheatsheet.txt"
